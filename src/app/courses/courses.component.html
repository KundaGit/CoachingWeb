<!-- SEARCH BAR -->
<div class="search-bar">
  <input 
    type="text" 
    [(ngModel)]="searchQuery" 
    placeholder="🔍 Search courses..."
  />
</div>

<h2>All Courses</h2>

<app-course-card 
  *ngFor="let course of filteredCourses"  
  [courseData]="course"
  [isExpanded]="expandedSlug === course.slug"
  (opened)="onCourseOpen(course.slug)">
</app-course-card>

<!-- DEBUG OUTSIDE -->
<pre *ngFor="let course of filteredCourses">
</pre>
